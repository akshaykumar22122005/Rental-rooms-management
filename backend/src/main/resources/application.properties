server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/rental_rooms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f5c8d0e2b4a6c8e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d}
app.jwt.expiration-ms=86400000

# File Storage Configuration
app.upload.dir=uploads

# Super Admin Initial Setup
app.admin.name=${ADMIN_NAME:System Administrator}
app.admin.email=${ADMIN_EMAIL:admin@rentalrooms.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.phone=${ADMIN_PHONE:+1234567890}
